[build-system]
# Hatchling 1.29+ emits Core Metadata 2.5, which Twine 6.2 cannot yet validate.
# Pin the backend so release artifacts remain reproducible and inspectable.
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "agentrust-trace-adapters"
version = "0.1.1"
description = "Build TRACE Trust Records from evidence another system produced, without fabricating what is not there"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AgenTrust Contributors", email = "imransiddique@live.com" }]
keywords = ["trace", "attestation", "adapter", "agent", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# TRACE 0.7.0 introduced the origin block and its software-only platform rule.
# The declared evidence-constructor default additionally requires TRACE 0.9.0;
# earlier models reject that policy mode.
dependencies = ["agentrust-trace>=0.9.0", "cryptography>=43.0.0"]

[project.urls]
Homepage = "https://github.com/agentrust-io/integrations"
Specification = "https://github.com/agentrust-io/trace-spec"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrust_trace_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
