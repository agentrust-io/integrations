[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrust-trace-adapters"
version = "0.1.0"
description = "Build TRACE Trust Records from evidence another system produced, without fabricating what is not there"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AgenTrust Contributors", email = "oss@agentrust-io.com" }]
keywords = ["trace", "attestation", "adapter", "agent", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# The origin block, and the rule that a non-self origin cannot carry a hardware
# platform, land in 0.7.0. An adapter built against an older model would emit
# records this package's whole premise depends on being rejected.
dependencies = ["agentrust-trace>=0.7.0"]

[project.urls]
Homepage = "https://github.com/agentrust-io/integrations"
Specification = "https://github.com/agentrust-io/trace-spec"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrust_trace_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
