attestation:
  provider: auto           # falls back to software-only when CMCP_DEV_MODE=1
  enforcement_mode: enforcing
  validity_seconds: 3600

# The point of this demo. Neither domain is built in to cMCP, and a deployment
# declares what its own classification means: leaving 'clinical' is a compliance
# boundary crossing, leaving 'external-analytics' is ordinary traffic.
sensitivity:
  compliance_domains:
    clinical: true
    external-analytics: false

policy_bundle_path: ./policies/
catalog_path: ./catalog.json
listen_addr: "127.0.0.1:8443"
audit_db_path: ./audit.db
