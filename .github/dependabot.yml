version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directories:
      - "/packages/agentrust-capture-core"
      - "/packages/agentrust-trace-adapters"
      - "/integrations/aeoess-aps"
      - "/integrations/comply54"
      - "/integrations/ramen-ai-cmcp"
      - "/integrations/spendguard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
