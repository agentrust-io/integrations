name: auditant-evidence-bundle conformance

on:
  push:
    paths:
      - "integrations/auditant-evidence-bundle/**"
      - ".github/workflows/auditant-evidence-bundle-conformance.yml"
  pull_request:
    paths:
      - "integrations/auditant-evidence-bundle/**"
      - ".github/workflows/auditant-evidence-bundle-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}

      - name: Install exact released dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --no-cache-dir \
            "agentrust-trace==0.11.0" \
            "agentrust-trace-tests==0.6.2" \
            "pytest==9.1.1"

      - name: Install only the thin integration locally
        run: python -m pip install --no-deps -e "integrations/auditant-evidence-bundle"

      - name: Integration tests
        run: python -m pytest integrations/auditant-evidence-bundle/tests -q

      - name: Emit a TRACE record from a demo bundle
        run: |
          python integrations/auditant-evidence-bundle/examples/emit_record.py \
            --out auditant.trace.json --bundle demo-bundle.json

      - name: Determine TRACE conformance level
        run: |
          trace-tests report \
            --record auditant.trace.json \
            --max-level 2 \
            --json auditant-trace-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("auditant-trace-report.json").read_text())
          assert report["tooling"]["suite"] == "0.6.2"
          assert report["tooling"]["library"] == "0.11.0"
          assert report["highest_level_passed"] == 0
          assert report["levels"][0]["passed"] is True
          assert report["levels"][1]["passed"] is False
          assert report["levels"][2]["passed"] is False
          PY

      - name: Transcript hash is the bundle bytes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          record = json.loads(Path("auditant.trace.json").read_text())
          digest = "sha256:" + hashlib.sha256(Path("demo-bundle.json").read_bytes()).hexdigest()
          assert record["tool_transcript"]["hash"] == digest
          PY

      - name: Enforce declared TRACE Level 0
        run: trace-tests verify --record auditant.trace.json --level 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auditant-conformance-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            demo-bundle.json
            auditant.trace.json
            auditant-trace-report.json
