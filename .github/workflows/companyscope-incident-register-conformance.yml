name: companyscope-incident-register conformance
on:
  push:
    paths:
      - "integrations/companyscope-incident-register/**"
      - "requirements/companyscope-incident-register-fixed.*"
      - ".github/workflows/companyscope-incident-register-conformance.yml"
  pull_request:
    paths:
      - "integrations/companyscope-incident-register/**"
      - "requirements/companyscope-incident-register-fixed.*"
      - ".github/workflows/companyscope-incident-register-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: floating (latest releases, drift detection)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install integration test dependencies
        run: python -m pip install agent-manifest pytest
      # This integration emits a human review pack, not a TRACE record.
      - name: Integration tests against the pinned feed fixture
        run: python -m pytest integrations/companyscope-incident-register/tests -q

  fixed:
    name: fixed (tested_against versions)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked integration test dependencies
        run: python -m pip install --require-hashes -r requirements/companyscope-incident-register-fixed.txt
      - name: Pinned version matches integration.yaml
        run: |
          python - <<'PY'
          import re
          from importlib.metadata import version
          from pathlib import Path
          manifest = Path("integrations/companyscope-incident-register/integration.yaml").read_text()
          expected = re.search(r'^  agent-manifest: "([^"]+)"$', manifest, re.M)
          assert expected is not None, "integration.yaml must declare tested_against.agent-manifest"
          actual = version("agent-manifest")
          assert actual == expected[1], (expected[1], actual)
          print(f"agent-manifest {actual} matches integration.yaml")
          PY
      # This integration emits a human review pack, not a TRACE record.
      - name: Integration tests against the pinned feed fixture
        run: python -m pytest integrations/companyscope-incident-register/tests -q
