name: docker-sandbox-kit conformance
on:
  push:
    paths:
      - "integrations/docker-sandbox-kit/**"
      - ".github/workflows/docker-sandbox-kit-conformance.yml"
  pull_request:
    paths:
      - "integrations/docker-sandbox-kit/**"
      - ".github/workflows/docker-sandbox-kit-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install released TRACE packages
        working-directory: integrations/docker-sandbox-kit
        run: python -m pip install -r requirements.txt
      # Builds, signs and verifies records from two published Kits, and checks
      # every refusal path.
      - name: Integration tests
        working-directory: integrations/docker-sandbox-kit
        run: python -m pytest -q
      - name: TRACE Level 0
        working-directory: integrations/docker-sandbox-kit
        run: |
          python - <<'PY'
          import json, pathlib
          from agentrust_trace import generate_key, key_to_jwk, sign_record
          from kit_to_trace import KitEvidence, build_from_kit
          key = generate_key()
          raw = pathlib.Path("fixtures/claude-acp-set-1.0.1.amd64.manifest.json").read_bytes()
          record = build_from_kit(
              KitEvidence.from_manifest(raw),
              subject="spiffe://example.org/agent/claude-acp",
              model_provider="anthropic",
              model_id="claude-sonnet-4-6",
              workload_digest="sha256:" + "e" * 64,
              jwk=key_to_jwk(key),
              kit_reference="docker.io/docker/sbx-kit-claude-acp-set",
          )
          pathlib.Path("signed-record.json").write_text(json.dumps(sign_record(record, key)))
          PY
          trace-tests verify --record signed-record.json --level 0
