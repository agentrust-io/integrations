name: windsurf tests

on:
  pull_request:
    paths:
      - "windsurf/**"
      - ".github/workflows/windsurf-tests.yml"
  push:
    branches: [main]
    paths:
      - "windsurf/**"
      - ".github/workflows/windsurf-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite against the core in this checkout
        run: |
          # The local package goes in with --no-deps: it has no runtime
          # dependencies of its own, so nothing here resolves against PyPI.
          pip install --require-hashes -r requirements/capture-core.txt
          pip install --no-deps ./packages/agentrust-capture-core
          cd windsurf
          python -m pytest tests -q

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the core from this checkout
        run: pip install --no-deps ./packages/agentrust-capture-core
      - name: Snapshot this repository's Windsurf composition
        run: python windsurf/engine/capture.py snapshot
      - name: Verify against the committed baseline
        run: python windsurf/engine/capture.py verify
