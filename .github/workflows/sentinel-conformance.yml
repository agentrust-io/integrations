name: sentinel conformance
on:
  push:
    paths:
      - "integrations/sentinel/**"
      - ".github/workflows/sentinel-conformance.yml"
  pull_request:
    paths:
      - "integrations/sentinel/**"
      - ".github/workflows/sentinel-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install integration test dependencies
        working-directory: integrations/sentinel
        run: python -m pip install -r requirements-dev.txt
      # The suite includes TRACE Level 0 checks and signed-claim round trips.
      - name: Integration tests
        working-directory: integrations/sentinel
        run: python -m pytest tests -q
