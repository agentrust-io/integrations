name: sentinel conformance
on:
  push:
    paths:
      - "integrations/sentinel/**"
      - "requirements/sentinel-fixed.*"
      - ".github/workflows/sentinel-conformance.yml"
  pull_request:
    paths:
      - "integrations/sentinel/**"
      - "requirements/sentinel-fixed.*"
      - ".github/workflows/sentinel-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: floating (latest releases, drift detection)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install integration test dependencies
        working-directory: integrations/sentinel
        run: python -m pip install -r requirements-dev.txt
      # The suite includes TRACE Level 0 checks and signed-claim round trips.
      - name: Integration tests
        working-directory: integrations/sentinel
        run: python -m pytest tests -q

  fixed:
    name: fixed (hash-locked snapshot)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked integration test dependencies
        run: python -m pip install --require-hashes -r requirements/sentinel-fixed.txt
      # The suite includes TRACE Level 0 checks and signed-claim round trips.
      - name: Integration tests
        working-directory: integrations/sentinel
        run: python -m pytest tests -q
