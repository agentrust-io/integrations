name: copilot tests

on:
  pull_request:
    paths:
      - "copilot/**"
      - ".github/workflows/copilot-tests.yml"
  push:
    branches: [main]
    paths:
      - "copilot/**"
      - ".github/workflows/copilot-tests.yml"

permissions:
  contents: read

jobs:
  # Standard library only, so the composite action needs no install step. 3.9 is
  # the floor the shared core supports.
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite against the core in this checkout
        run: |
          pip install ./packages/agentrust-capture-core pytest
          cd copilot
          python -m pytest tests -q

  # A smoke test that the engine runs end to end against a real repository. The
  # enforcing gate is copilot-integrity.yml, which runs on every pull request
  # rather than only when copilot/** changes; verifying here as well would mean
  # two jobs enforcing one rule on different triggers.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the core from this checkout
        run: pip install ./packages/agentrust-capture-core
      - name: Snapshot this repository's Copilot composition
        run: python copilot/engine/capture.py snapshot
