name: evidencebound-core conformance

on:
  push:
    paths:
      - "integrations/evidencebound-core/**"
      - ".github/workflows/evidencebound-core-conformance.yml"
  pull_request:
    paths:
      - "integrations/evidencebound-core/**"
      - ".github/workflows/evidencebound-core-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Install exact released dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --no-cache-dir \
            "evidencebound-core[crypto]==0.4.0" \
            "agentrust-trace==0.11.0" \
            "agentrust-trace-tests==0.6.2" \
            "pytest==9.1.1"

      - name: Verify released EvidenceBound install
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          assert metadata.version("evidencebound-core") == "0.4.0"
          dist = metadata.distribution("evidencebound-core")
          assert not any(
              str(path).endswith("direct_url.json")
              for path in (dist.files or ())
          )
          PY

      - name: Install only the thin integration locally
        run: python -m pip install --no-deps -e "integrations/evidencebound-core"

      - name: Integration tests
        run: python -m pytest integrations/evidencebound-core/tests -q

      - name: Emit synthetic TRACE record
        run: |
          python integrations/evidencebound-core/examples/emit_record.py \
            --out evidencebound.trace.json

      - name: Determine TRACE conformance level
        run: |
          trace-tests report \
            --record evidencebound.trace.json \
            --max-level 2 \
            --json evidencebound-trace-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidencebound-trace-report.json").read_text())
          assert report["tooling"]["suite"] == "0.6.2"
          assert report["tooling"]["library"] == "0.11.0"
          assert report["highest_level_passed"] == 0
          assert report["levels"][0]["passed"] is True
          assert report["levels"][1]["passed"] is False
          assert report["levels"][2]["passed"] is False
          PY

      - name: Enforce declared TRACE Level 0
        run: trace-tests verify --record evidencebound.trace.json --level 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidencebound-conformance-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            evidencebound.trace.json
            evidencebound-trace-report.json
