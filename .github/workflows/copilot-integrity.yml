name: Copilot integrity

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only granted so the comment can be posted on pull requests from this
      # repository. GITHUB_TOKEN is read-only on fork pull requests regardless,
      # which is why commenting is switched off for those below rather than left
      # to fail a contribution that did nothing wrong.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify the approved Copilot composition
        uses: ./copilot
        with:
          # On for pull requests from this repository, off for forks, where the
          # token is read-only and the comment step would 403. The job summary
          # carries the same result either way, so a fork contributor loses the
          # comment and nothing else.
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-drift: "true"
