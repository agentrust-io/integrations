# MUSUBI companion for cA2A workflow.
#
# fixed     installs the entry with its exact pins (ca2a-runtime 0.4.0 and
#           nenrin-verify 0.5.6, see integration.yaml and pyproject.toml).
# floating  installs the latest released ca2a-runtime instead, unpinned on
#           purpose, so a cA2A release that moves the private
#           _check_revocation call or changes a verdict shows up here
#           (agentrust-io/ca2a#263).
# Both settle the 57 vendored vectors, check the vendored bytes, and rebuild
# the vectors with ca2a-runtime. Nothing is fetched at test time.
name: horizonshield-ca2a-companion conformance
on:
  push:
    paths:
      - "integrations/horizonshield-ca2a-companion/**"
      - ".github/workflows/horizonshield-ca2a-companion-conformance.yml"
  pull_request:
    paths:
      - "integrations/horizonshield-ca2a-companion/**"
      - ".github/workflows/horizonshield-ca2a-companion-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch drift against the latest ca2a-runtime release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.mode }} (py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        mode: [fixed, floating]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install this integration with its pins
        if: matrix.mode == 'fixed'
        run: pip install -e "integrations/horizonshield-ca2a-companion[test]"
      - name: Install the latest ca2a-runtime release
        if: matrix.mode == 'floating'
        run: pip install ca2a-runtime "nenrin-verify==0.5.6" "pytest>=8"
      - name: Record the versions under test
        run: pip show ca2a-runtime nenrin-verify | grep -E '^(Name|Version):'
      - name: Integration tests
        run: python -m pytest integrations/horizonshield-ca2a-companion/tests -q
