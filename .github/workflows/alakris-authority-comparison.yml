name: Alakris authority comparison evidence checks

on:
  pull_request:
    paths:
      - "integrations/alakris-authority-comparison/**"
      - ".github/workflows/alakris-authority-comparison.yml"
  push:
    branches: [main]
    paths:
      - "integrations/alakris-authority-comparison/**"
      - ".github/workflows/alakris-authority-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install released packages
        working-directory: integrations/alakris-authority-comparison
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Check fixtures, boundaries and reference shape
        working-directory: integrations/alakris-authority-comparison
        run: python check_package.py --fetch
