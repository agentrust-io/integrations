# CHAP approval-outcome integration workflow.
#
# Two jobs, following aeoess-aps (#169):
#   floating  installs the latest released packages, CHAP included, unpinned on
#             purpose, as drift detection against both protocols.
#   fixed     installs exactly the versions integration.yaml records, plus the
#             chap-coordinator release the tests were written against.
# Both drive a live CHAP coordinator: the tests, the emitted record, and the
# trace-spec fixture set are produced by chap-coordinator on every run.
# Lives at repo root because GitHub Actions only discovers workflows there.
name: chap conformance
on:
  push:
    paths:
      - "integrations/chap/**"
      - ".github/workflows/chap-conformance.yml"
  pull_request:
    paths:
      - "integrations/chap/**"
      - ".github/workflows/chap-conformance.yml"
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch drift against the latest released packages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floating:
    name: floating (latest releases, drift detection)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install released packages
        run: pip install agentrust-trace agentrust-trace-tests chap-coordinator
      - name: Install this integration
        run: pip install -e "integrations/chap[test]"
      - name: Integration tests
        run: pytest integrations/chap/tests -q
      - name: Emit a record citing a live CHAP approval
        run: python integrations/chap/examples/emit_record.py --out trust-record.jwt
      - name: TRACE conformance
        run: trace-tests verify --record trust-record.jwt --level 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: floating-${{ matrix.os }}-py${{ matrix.python }}
          path: trust-record.jwt

  fixed:
    name: fixed (tested_against versions)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package set that reproduces the tested_against result
        run: |
          pip install "agentrust-trace==0.10.0" "agentrust-trace-tests==0.5.1" "chap-coordinator==0.2.13"
      - name: Pinned versions match integration.yaml
        run: |
          python - <<'PY'
          import re, sys
          from importlib.metadata import version
          y = open("integrations/chap/integration.yaml").read()
          want = dict(re.findall(r'^  (agentrust-trace|agentrust-trace-tests): "([^"]+)"', y, re.M))
          have = {k: version(k) for k in want}
          print(want, have)
          sys.exit(0 if want == have else 1)
          PY
      - name: Install this integration
        run: pip install -e "integrations/chap[test]"
      - name: Integration tests
        run: pytest integrations/chap/tests -q
      - name: Emit a record citing a live CHAP approval
        run: python integrations/chap/examples/emit_record.py --out trust-record.jwt
      - name: TRACE conformance
        run: trace-tests verify --record trust-record.jwt --level 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fixed-${{ matrix.os }}-py${{ matrix.python }}
          path: trust-record.jwt
