# Repository-wide support policy. Exact integration runs remain recorded in
# each integration.yaml under tested_against.
python:
  supported: ["3.11", "3.12", "3.13"]
packages:
  agentrust-trace:
    minimum: "0.5.0"
  agentrust-trace-tests:
    minimum: "0.4.0"
  cmcp-runtime:
    minimum: "0.2.0"
  agent-manifest:
    minimum: "0.3.0"
  # The WCM reference SDK. The GitHub repository is still private, so an
  # integration cites the PyPI release and the documentation site, never a
  # github.com/agentrust-io/weight-custody-manifest URL: those 404 for every
  # anonymous reader.
  weight-custody-manifest:
    minimum: "0.27.0"
