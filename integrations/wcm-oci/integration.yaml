name: WCM OCI Referrer
vendor: agentrust-io
integrates_with:
  - wcm
description: >-
  Attaches a signed WCM manifest to a model artifact as an OCI v1.1 referrer, and
  grades how strongly the referrer binds to the actual weight bytes.
maintainer:
  github: imran-siddique
repository: https://github.com/agentrust-io/integrations
homepage: https://wcm.agentrust-io.com
license: Apache-2.0
tier: community
marketplace:
  display_name: WCM OCI Referrer
  category: Model & weight custody
  mark: OCI
  keywords: [oci, oras, registry, referrers]
wcm_roles:
  - manifest-producer
  - manifest-verifier
wcm_conformance_levels:
  - L1
tested_against:
  weight-custody-manifest: "0.26.0"
