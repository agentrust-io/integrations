[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anthropic-tool-loop-trace"
version = "0.1.0"
description = "Records an Anthropic Messages API tool loop as AgenTrust Telemetry events and signs one TRACE record per run"
readme = "README.md"
# The in-process writer is standard library only and runs on 3.9. The recorder extra needs 3.11+.
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
recorder = [
  "agentrust-telemetry==0.1.0a6",
  "agentrust-trace>=0.11.0",
]
otel = ["opentelemetry-sdk>=1.25"]
test = [
  "pytest>=8",
  "opentelemetry-sdk>=1.25",
  "agentrust-trace-tests>=0.6.2",
]

[tool.setuptools]
packages = ["anthropic_tool_loop_trace"]
