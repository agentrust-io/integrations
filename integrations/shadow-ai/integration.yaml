name: Shadow AI Discovery
vendor: agentrust-io
# Qualified targets, not direct compatibility (integrations#215): audit records
# must first be enriched with a trustworthy agent_id, and suggested_manifest_id
# is only a naming hint for Agent Manifest. No tested_against: no direct run
# against a released cmcp-runtime or agent-manifest has been recorded.
integrates_with:
  - cmcp
  - agent-manifest
description: >-
  Compares enriched tool-call audit records against a separate agent-to-tools
  registry to report unregistered agents and undeclared tools. Does not read
  cMCP output directly.
maintainer:
  github: imran-siddique
repository: https://github.com/agentrust-io/integrations
license: Apache-2.0
tier: community
marketplace:
  category: Identity & trust
  mark: SH
  keywords: [discovery, undeclared, remediation]
