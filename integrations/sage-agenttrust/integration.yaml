name: SAGE AgenTrust Bridge
vendor: SAGE
integrates_with:
  - cmcp
  - trace
description: >-
  Reverse proxy that edge-verifies a TRACE record (key-equal) or cMCP
  RuntimeClaim (gateway-asserted) before admitting a memory submit to a stock,
  unmodified SAGE consensus-memory node.
maintainer:
  github: l33tdawg
  email: dhillon.andrew@gmail.com
repository: https://github.com/l33tdawg/sage-agenttrust
homepage: https://github.com/l33tdawg/sage
license: Apache-2.0
tier: community
marketplace:
  category: Security & policy
  mark: SG
  keywords: [memory, proxy, consensus]
# Both paths pass Level 0: the cMCP-RuntimeClaim (envelope) form, and — since
# agentrust-trace-tests 0.5.1 loads a standalone TRACE record as fmt="trace" — the bare C-2
# record the bridge mints. Level 1 is not claimed: software-only has no hardware root.
trace_conformance_level: 0
trace_roles:
  - record-consumer
tested_against:
  cmcp-runtime: "0.5.0"
  agentrust-trace: "0.10.0"
  agentrust-trace-tests: "0.5.1"
