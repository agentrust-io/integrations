# Copy this directory to integrations/<vendor>-<product>/ and fill in.
# Validated in CI against schema/integration.schema.json.
name: Example Product
vendor: Example Corp
integrates_with:
  - cmcp        # one or more of: cmcp, trace, agent-manifest, wcm, ca2a
description: >-
  One technical sentence describing what this integration does.
maintainer:
  github: your-github-username
repository: https://github.com/example/example-product
license: Apache-2.0
tier: community   # set by maintainers during review; submissions start here
marketplace:
  category: Developer tools  # choose the closest category allowed by the schema
  mark: EX                   # 1-3 letters/numbers shown when no logo is available
# featured is maintainer-curated; do not add it to new submissions
# keywords: [framework, use-case]
# Required if you emit or consume TRACE records:
# trace_conformance_level: 1
# trace_roles:
#   - record-producer  # or record-consumer / external-evidence-source
# Required if you integrate with WCM. Roles say what you do; levels say which
# `wcm conformance` layers you pass. attestation-source and evidence-consumer
# verify no manifest and therefore declare no level.
# wcm_roles:
#   - manifest-verifier  # or manifest-producer / key-broker / protected-runtime /
#                        # attestation-source / evidence-consumer
# wcm_conformance_levels: ["L1"]
tested_against:
  cmcp-runtime: "0.2.0"
